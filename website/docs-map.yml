# Which documentation pages describe which part of the code. The release step of /new-version runs
# `python website/tools/affected.py` (changes since the previous release tag) and re-reads the pages listed for every
# changed file. Patterns are fnmatch-style over repo-relative paths («*» also crosses «/»). Keep it coarse: a page
# that is listed once too often costs a re-read; a page that is missing goes stale. Screens («Довідник екранів»)
# and screenshots are regenerated on every build and need no entry here.
pages:
  start/install.md:
    - build/*
    - .github/workflows/release-*
    - src/OrientPyx.Presentation/Program.cs
    - src/OrientPyx.Presentation/*About*
    - src/OrientPyx.Presentation/*Update*
    - src/OrientPyx.DataAccess/*AppDatabasePaths*
