name: Docs

# Builds the user documentation (website/, MkDocs Material) and publishes it to GitHub Pages.
#
# * A release tag (v*) publishes the tagged texts with screenshots rendered from the tagged app — the site always
#   describes the version people can download.
# * A manual run (Actions → Docs → Run workflow) publishes the texts of the chosen branch (a typo fix between
#   releases) but still renders the screenshots from the latest release tag, so no unreleased screen appears.
#
# Screenshots and demo competitions are never committed: the DocShots tests (tests/OrientPyx.Tests/DocShots) render
# them here into website/content/shots and website/content/demo. «Довідник екранів» and «Що нового» are generated by
# website/hooks.py. One-time repository setting: Settings → Pages → Source: GitHub Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Windows, like the local runs, so the headless screenshots render the same.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, for the manual run

      - name: App sources for the screenshots
        id: app
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            "dir=$env:GITHUB_WORKSPACE" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $tag = git describe --tags --abbrev=0 --match 'v*'
          git worktree add "$env:RUNNER_TEMP\release-src" $tag
          Write-Host "Screenshots from $tag"
          "dir=$env:RUNNER_TEMP\release-src" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Render the screenshots and demo competitions
        shell: pwsh
        env:
          ORIENTPYX_DOCSHOTS: ${{ github.workspace }}\website\content
          # No real competitions on the screenshots: the fixtures folder is git-ignored anyway, point it nowhere.
          ORIENTPYX_TEST_FIXTURES: ${{ runner.temp }}\no-fixtures
        run: dotnet test "${{ steps.app.outputs.dir }}\tests\OrientPyx.Tests.sln" --filter "Category=DocShots" --nologo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r website/requirements.txt

      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}     # «Що нового» reads the releases through the API
        run: mkdocs build --strict -f website/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
